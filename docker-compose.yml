version: "3.8"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smarthome-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=P@ssw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'select 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-net

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: dotnetweb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8880:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - smarthome-net

volumes:
  mssql_data:

networks:
  smarthome-net:
